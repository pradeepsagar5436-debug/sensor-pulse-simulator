spring.application.name=sensor-simulator-backend
server.port=8080

# Database Configuration (Persistent H2 database in ./data/sensordb)
spring.datasource.url=jdbc:h2:file:./data/sensordb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Security Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Access token: 15 minutes (in milliseconds)
app.jwt.access-token-expiration-ms=900000
# Refresh token: 7 days (in milliseconds)
app.jwt.refresh-token-expiration-ms=604800000

# Email Configuration (Real SMTP sending via Gmail)
app.mail.simulation-mode=false
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tharunvarun556@gmail.com
spring.mail.password=fxszkdjddduwkehr
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Logging
logging.level.com.sensor.simulator=INFO
logging.level.org.springframework.security=WARN
